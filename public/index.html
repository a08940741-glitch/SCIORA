<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIORA · Global Knowledge &amp; Learning Intelligence</title>
  <meta name="description" content="SCIORA — an AI learning and knowledge platform: Learning Assistant, Knowledge Explorer and Evidence Analyzer, with honest, transparent AI.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" id="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7L12 2.5Z"/><path d="M8.5 9.5c0-1.4 1.6-2.2 3.5-2.2s3.4.8 3.4 2c0 2.9-6.9 1.6-6.9 4.8 0 1.3 1.5 2.3 3.5 2.3 2.1 0 3.5-.9 3.5-2.3"/></svg></span>
        <div class="brand-text">
          <h1 class="brand-name" dir="ltr">SCIORA</h1>
          <p class="tagline" id="tagline"></p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="SCIORA" aria-orientation="vertical">
        <button type="button" role="tab" id="tab-learn" aria-controls="panel-learn" aria-selected="true"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6.5 12 3l8 3.5-8 3.5L4 6.5Z"/><path d="M7 8.3V13c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V8.3"/><path d="M20 6.5V12"/></svg><span class="tab-label"></span></button>
        <button type="button" role="tab" id="tab-explore" aria-controls="panel-explore" aria-selected="false" tabindex="-1"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span class="tab-label"></span></button>
        <button type="button" role="tab" id="tab-evidence" aria-controls="panel-evidence" aria-selected="false" tabindex="-1"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 5 6v5c0 4.2 2.9 7.9 7 9 4.1-1.1 7-4.8 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span class="tab-label"></span></button>
        <button type="button" role="tab" id="tab-cards" aria-controls="panel-cards" aria-selected="false" tabindex="-1"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="13" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg><span class="tab-label"></span></button>
        <button type="button" role="tab" id="tab-progress" aria-controls="panel-progress" aria-selected="false" tabindex="-1"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span class="tab-label"></span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="ui-lang">
          <label id="ui-lang-label" for="ui-lang" class="ui-lang-label"></label>
          <select id="ui-lang"></select>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <div id="mode-banner" class="mode-banner" role="status">…</div>

      <section id="hero" class="hero" aria-labelledby="hero-title">
        <div class="hero-inner">
          <h2 id="hero-title" class="hero-title"></h2>
          <p id="hero-text" class="hero-text"></p>
          <div class="pillars">
            <button type="button" class="pillar" data-goto="learn"><span class="pillar-title"></span><span class="pillar-text"></span></button>
            <button type="button" class="pillar" data-goto="explore"><span class="pillar-title"></span><span class="pillar-text"></span></button>
            <button type="button" class="pillar" data-goto="evidence"><span class="pillar-title"></span><span class="pillar-text"></span></button>
          </div>
        </div>
      </section>

  <main id="main" class="layout">
    <div class="main-col">
     <section id="panel-learn" role="tabpanel" aria-labelledby="tab-learn">
      <section class="card ask-card">
        <h2 id="learn-title"></h2>
        <p id="learn-intro" class="muted"></p>
        <form id="ask-form" novalidate>
          <label id="ask-label" for="question" class="label"></label>
          <textarea id="question" rows="3" maxlength="1000" required dir="auto"></textarea>
          <div class="row">
            <div class="field">
              <label id="level-label" for="level" class="label"></label>
              <select id="level"></select>
            </div>
            <div class="field">
              <label id="language-label" for="language" class="label"></label>
              <select id="language"></select>
            </div>
            <button id="ask-btn" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
        <div id="demo-topics"></div>
      </section>

      <div id="lesson"></div>
      <div id="exercises"></div>
     </section>

     <section id="panel-explore" role="tabpanel" aria-labelledby="tab-explore" hidden>
      <section class="card ask-card">
        <h2 id="k-title"></h2>
        <p id="k-intro" class="muted"></p>
        <form id="k-form" novalidate>
          <label id="k-ask-label" for="k-question" class="label"></label>
          <textarea id="k-question" rows="3" maxlength="1000" required dir="auto"></textarea>
          <div class="row">
            <div class="field">
              <label id="k-level-label" for="k-level" class="label"></label>
              <select id="k-level"></select>
            </div>
            <div class="field">
              <label id="k-language-label" for="k-language" class="label"></label>
              <select id="k-language"></select>
            </div>
            <button id="k-ask" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
        <div id="k-topics"></div>
      </section>
      <div id="k-result"><p id="k-empty" class="empty-state"></p></div>
     </section>

     <section id="panel-evidence" role="tabpanel" aria-labelledby="tab-evidence" hidden>
      <section class="card ask-card">
        <h2 id="e-title"></h2>
        <p id="e-intro" class="muted"></p>
        <form id="e-form" novalidate>
          <label id="e-claim-label" for="e-claim" class="label"></label>
          <textarea id="e-claim" rows="3" maxlength="1000" required dir="auto"></textarea>
          <div class="row">
            <div class="field">
              <label id="e-language-label" for="e-language" class="label"></label>
              <select id="e-language"></select>
            </div>
            <button id="e-analyze" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
        <div id="e-claims"></div>
      </section>
      <div id="e-result"><p id="e-empty" class="empty-state"></p></div>
     </section>

     <section id="panel-cards" role="tabpanel" aria-labelledby="tab-cards" hidden>
      <section class="card">
        <h2 id="c-title"></h2>
        <p id="c-intro" class="muted"></p>
        <div class="row">
          <div class="field"><input id="c-search" type="search" maxlength="100" dir="auto"></div>
          <div class="field"><select id="c-collection"></select></div>
          <button id="c-export" type="button" class="btn btn-secondary"></button>
        </div>
        <p id="c-count" class="muted"></p>
      </section>
      <div id="c-list"></div>
     </section>

     <section id="panel-progress" role="tabpanel" aria-labelledby="tab-progress" hidden>
      <section class="card">
        <h2 id="p-title"></h2>
        <p id="p-intro" class="muted"></p>
        <p id="p-note" class="estimate-note"></p>
      </section>
      <div id="p-body"></div>
     </section>
    </div>

    <aside class="side-col">
      <section class="card" id="estimate">
        <h2 id="estimate-title" class="side-title"></h2>
        <div id="estimate-body"></div>
        <button id="clear-btn" type="button" class="btn btn-secondary"></button>
        <p id="clear-msg" class="muted" role="status"></p>
      </section>
      <section class="card" id="responsible">
        <h2 id="responsible-title" class="side-title"></h2>
        <ul id="responsible-list" class="responsible"></ul>
        <p id="phase-note" class="muted"></p>
      </section>
    </aside>
  </main>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>
</body>
</html>
